[build]
  command = "pnpm run build"
  publish = ".next"

[[redirects]]
  from = "https://lyfline.netlify.app/*"
  to = "https://lyfline.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://dev.lyfline.id/*"
  to = "https://lyfline.id/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
